name: Desktop Release (Windows & macOS)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      - run: node --test desktop/security.test.cjs desktop/proxy.test.cjs
      - run: pip install -c requirements-lock.txt -e "./backend[dev]"
      - run: python -m pytest backend/tests -q --tb=short
      - name: Check release version
        shell: bash
        run: |
          python scripts/packaging/check_version.py
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
          fi
      - name: Require desktop distribution license review
        if: startsWith(github.ref, 'refs/tags/')
        env:
          DESKTOP_LICENSE_REVIEWED: ${{ vars.DESKTOP_LICENSE_REVIEWED }}
        run: |
          if [ "$DESKTOP_LICENSE_REVIEWED" != "true" ]; then
            echo "::error::Desktop distribution license review is pending. See docs/DESKTOP_LICENSE_REVIEW.md; do not publish bundles as MIT-only."
            exit 1
          fi

  build:
    needs: verify
    name: Build ${{ matrix.os }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
            arch: x64
          - os: macos
            runner: macos-15-intel
            arch: x64
          - os: macos
            runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install and verify native architecture
        shell: bash
        run: |
          npm ci
          npm --prefix frontend ci
          python -c "import platform; expected='${{ matrix.arch }}'; actual=platform.machine().lower(); assert actual in ({'amd64', 'x86_64'} if expected == 'x64' else {'arm64', 'aarch64'}), (expected, actual)"
          python -m pip install -r requirements-lock.txt
          python -m pip install -e backend --no-deps
          python -m pip install pyinstaller
      - name: Build frontend and packaged backend
        shell: bash
        run: |
          npm run build:frontend
          python -m PyInstaller scripts/packaging/ScholarNovaBackend.spec --noconfirm --clean
          python scripts/packaging/stage_backend.py
      - name: Package Windows
        if: matrix.os == 'windows'
        run: npx electron-builder --win nsis portable --x64 --publish never
      - name: Package macOS
        if: matrix.os == 'macos'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never
      - name: Smoke test Windows app
        if: matrix.os == 'windows'
        run: |
          python scripts/packaging/smoke_desktop.py desktop/dist/win-unpacked/ScholarNova.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Content package.json | ConvertFrom-Json).version
          python scripts/packaging/smoke_desktop.py "desktop/dist/ScholarNova-Portable-$version-x64.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/packaging/smoke_backend.py desktop/dist/win-unpacked/resources/backend/ScholarNovaBackend/ScholarNovaBackend.exe
      - name: Smoke test macOS app
        if: matrix.os == 'macos'
        shell: bash
        run: |
          app=$(find desktop/dist -path '*/ScholarNova.app/Contents/MacOS/ScholarNova' -type f | head -n 1)
          test -n "$app"
          python scripts/packaging/smoke_desktop.py "$app"
          python scripts/packaging/smoke_backend.py "$(dirname "$app")/../Resources/backend/ScholarNovaBackend/ScholarNovaBackend"
      - uses: actions/upload-artifact@v4
        with:
          name: ScholarNova-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish verified desktop release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Produce checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cd artifacts
          sha256sum *.exe *.dmg *.zip > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" *.exe *.dmg *.zip SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "ScholarNova $GITHUB_REF_NAME" \
            --notes-file "../docs/releases/${GITHUB_REF_NAME}.md"
