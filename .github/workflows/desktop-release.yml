name: Desktop Release (Windows & macOS)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installer and portable app
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Build Windows desktop artifacts
        shell: pwsh
        run: npm run dist:win

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScholarNova-Windows-${{ github.ref_name }}
          path: desktop/dist/*.exe
          if-no-files-found: error

  build-macos:
    name: Build macOS app (${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix frontend ci
          python -m pip install -r requirements-lock.txt
          python -m pip install -e backend --no-deps
          python -m pip install pyinstaller

      - name: Build frontend
        run: npm run build:frontend

      - name: Build and stage backend
        run: |
          python -m PyInstaller scripts/packaging/ScholarNovaBackend.spec --noconfirm --clean
          python scripts/packaging/stage_backend.py

      - name: Package macOS app (${{ matrix.arch }})
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScholarNova-macOS-${{ matrix.arch }}-${{ github.ref_name }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish tagged GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            artifacts/*.exe artifacts/*.dmg artifacts/*.zip \
            --repo "${{ github.repository }}" \
            --title "ScholarNova ${{ github.ref_name }}" \
            --generate-notes
